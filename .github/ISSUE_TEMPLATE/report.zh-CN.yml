name: "错误或改进建议（简体中文）"
description: "报告制作流程问题、错误或改进建议"
body:
  - type: markdown
    attributes:
      value: |
        不接受 Pull Request。请只提供必要信息，不要提交认证信息、个人资料和路径、非公开素材、原始模型、完整项目或完整聊天。截图和错误摘录中也请移除私人内容。
        商业许可和再分发咨询请联系 divedesign.info@gmail.com，不要公开财务资料。
  - type: dropdown
    id: kind
    attributes:
      label: 报告类型
      options:
        - 错误或未成功的制作流程
        - 改进建议
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 套件版本
      description: package.json 或下载的专用 ZIP 中的版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS 与浏览器
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent、模型与制作阶段
      description: Skill 相关问题请填写，并按需补充 Blender 和工具版本
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤或改进建议
      description: 仅填写解释或复现问题所需的信息
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 改进建议请说明当前情况
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 此报告不包含秘密、个人信息、非公开素材或制作原件
          required: true
